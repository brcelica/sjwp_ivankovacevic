<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tablice vježba</title>
  </head>
  <body>
    <h1>Tablice</h1>
    <table border="1" style="border-collapse: collapse">
      <tr>
        <th>Tvrtka</th>
        <th>Kontakt</th>
        <th>Zemlja</th>
      </tr>
      <tr>
        <td>Microsoft</td>
        <td>jozo Bošnjak</td>
        <td>Hrvatska</td>
      </tr>
      <tr>
        <td>Jerko Trans doo</td>
        <td>Mislav Jerkić</td>
        <td>Bosna</td>
      </tr>
    </table>
    <h2>Spajanje stupaca</h2>
    <table border="1">
      <tr>
        <th colspan="2">Ime i prezime</th>
        <th>Godine</th>
      </tr>
      <tr>
        <td>Ivo</td>
        <td>Ivić</td>
        <td>22</td>
      </tr>
      <tr>
        <td>Josip</td>
        <td>Mihić</td>
        <td>25</td>
      </tr>
    </table>
    <h2>Spajanje redaka</h2>
    <table border="1" style="width: 600px">
      <tr>
        <th>Ime</th>
        <td>josip</td>
      </tr>
      <tr>
        <th rowspan="2">mobitel</th>
        <td style="text-align: center">555-5689</td>
      </tr>
      <tr>
        <td>555-5689</td>
      </tr>
    </table>
  </body>
</html>
